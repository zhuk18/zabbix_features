                          return hexToColon(raw);
                      }

                      if (raw.length > 1 && raw.charAt(0) === '"' && raw.charAt(raw.length - 1) === '"') {
                          raw = raw.substring(1, raw.length - 1);
                      }
                      else if (row.type === 'INTEGER' || row.type === 'Gauge32' || row.type === 'Counter32' || row.type === 'Unsigned32') {
                          m = /\((-?[0-9]+)\)\s*$/.exec(raw);

                          if (m !== null) {
                              raw = m[1];
                          }
