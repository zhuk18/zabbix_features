                  /* dotted decimal octets ("170.187.204") -> "aa:bb:cc" */
                  function decimalOctetsToMac(parts) {
                      var out = [], i, h;

                      for (i = 0; i < parts.length; i++) {
                          h = parseInt(parts[i], 10).toString(16);
                          out.push(h.length < 2 ? '0' + h : h);
                      }

                      return out.join(':');
