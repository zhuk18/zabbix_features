zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 79f31eeab03146229b1e019097fad672
      name: Templates
  templates:
    - uuid: 7a25304ee1594ed68f582ef727cfd1fd
      template: 'Topology Discovery Reporter'
      name: 'Topology Discovery Reporter'
      description: 'Topology discovery collector (prototype, spec §4.1): Trapper items + self-monitoring heartbeat trigger for a reporter Host.'
      groups:
        - name: Templates
      items:
        - uuid: 1f98e3884c134297932c10a68838ca03
          name: 'LLDP local chassis ID'
          type: DEPENDENT
          key: lldp.loc.chassis
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.reporter.chassis_id
          master_item:
            key: topology.discovery.raw
        - uuid: 0ac061255e524d94b895f965981dd09b
          name: 'LLDP local system name'
          type: DEPENDENT
          key: lldp.loc.name
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.reporter.sysname
          master_item:
            key: topology.discovery.raw
        - uuid: 6430a7f3ec1d47d586204644dfe93d5b
          name: 'Topology discovery heartbeat'
          type: TRAP
          key: topology.discovery.heartbeat
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          triggers:
            - uuid: c5282161e47c4fb3b84dd04ea16582aa
              expression: 'nodata(/Topology Discovery Reporter/topology.discovery.heartbeat,10m)'
              name: 'Topology discovery heartbeat missing on {HOST.NAME} for 10m'
              priority: AVERAGE
              description: '10m staleness window: prototype has no fixed push interval mandated (spec §4.1); 10m gives generous headroom over any reasonable push cadence (e.g. 1-5m) while still catching a genuinely stalled/misconfigured push component promptly. Adjust to match the real push interval once one is fixed.'
              manual_close: 'YES'
        - uuid: c1e2b45c337340059c773057252cf5bc
          name: 'Topology discovery raw blob'
          type: TRAP
          key: topology.discovery.raw
          value_type: TEXT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
      discovery_rules:
        - uuid: c3f8298f2461498b89e9764f3c3a4f07
          name: 'CDP neighbor discovery'
          type: DEPENDENT
          key: cdp.rem.discovery
          lifetime_type: DELETE_NEVER
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: d5945a18cab94f928770bd7b0691a8dc
              name: 'CDP neighbor on {#LOCPORT}'
              type: DEPENDENT
              key: 'cdp.rem[{#IFINDEX},"{#REM.DEVICEID}","{#REM.PORTID}"]'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // cdp.rem[{#IFINDEX},"{#REM.DEVICEID}","{#REM.PORTID}"] item prototype preprocessing, step 1 of
                      // 2 (T-model revised spec §3.1). Selects the CDP neighbor matching this item's own key
                      // parameters. Absent -> {"present":false}; never throws.
                      
                      var TARGET_IFINDEX = '{#IFINDEX}';
                      var TARGET_DEVICEID = '{#REM.DEVICEID}';
                      var TARGET_PORTID = '{#REM.PORTID}';
                      
                      function truncate255(s) {
                      	s = (s === undefined || s === null) ? '' : String(s);
                      	return s.length > 255 ? s.substring(0, 255) : s;
                      }
                      
                      var data;
                      try {
                      	data = JSON.parse(value);
                      }
                      catch (e) {
                      	return JSON.stringify({present: false});
                      }
                      
                      var neighbors = data.cdp_neighbors || [];
                      for (var i = 0; i < neighbors.length; i++) {
                      	var n = neighbors[i];
                      	if (!n.remote_device_id) {
                      		continue;
                      	}
                      	if (String(n.local_if_index) === TARGET_IFINDEX
                      			&& truncate255(n.remote_device_id || '') === TARGET_DEVICEID
                      			&& truncate255(n.remote_port_id || '') === TARGET_PORTID) {
                      		return JSON.stringify({present: true, neighbor: n});
                      	}
                      }
                      
                      return JSON.stringify({present: false});
                      
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: topology.discovery.raw
              tags:
                - tag: interface
                  value: '{#LOCPORT}'
                - tag: topo.neighbor.chassis
                - tag: topo.neighbor.chassis_type
                - tag: topo.neighbor.mgmt_ip
                - tag: topo.neighbor.name
                  value: '{#REM.DEVICEID}'
                - tag: topo.neighbor.port
                  value: '{#REM.PORTID}'
                - tag: topo.neighbor.port_descr
                - tag: topo.role
                  value: neighbor
                - tag: topo.via
                  value: cdp
          master_item:
            key: topology.discovery.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // cdp.rem.discovery LLD preprocessing (T-model revised spec §3.1). Reads $.cdp_neighbors[]
                  // (populated by push.py's cdpCacheTable walk -- a genuinely separate, Cisco-proprietary MIB
                  // from lldpRemTable, hence a separate LLD rule rather than folding into lldp.rem.discovery).
                  // CDP never carries a chassis id or its subtype (cdpCacheTable has no equivalent column) --
                  // topo.neighbor.chassis/chassis_type stay empty for every CDP-sourced item by design, not an
                  // oversight; identity for a CDP-only neighbor falls through to name/mgmt_ip matching only
                  // (§4.2's priority order already handles an empty chassis field the same way for any source).
                  
                  function truncate255(s) {
                  	s = (s === undefined || s === null) ? '' : String(s);
                  	return s.length > 255 ? s.substring(0, 255) : s;
                  }
                  
                  var data;
                  try {
                  	data = JSON.parse(value);
                  }
                  catch (e) {
                  	return JSON.stringify([]);
                  }
                  
                  var portsByIndex = {};
                  var ports = data.ports || [];
                  for (var p = 0; p < ports.length; p++) {
                  	portsByIndex[ports[p].if_index] = ports[p];
                  }
                  
                  var out = [];
                  var neighbors = data.cdp_neighbors || [];
                  for (var i = 0; i < neighbors.length; i++) {
                  	var n = neighbors[i];
                  	if (!n.remote_device_id) {
                  		continue; // nothing to key a Device on at all
                  	}
                  	var localPort = portsByIndex[n.local_if_index];
                  	var locPortName = localPort ? localPort.name : String(n.local_if_index);
                  
                  	out.push({
                  		'{#IFINDEX}': String(n.local_if_index),
                  		'{#LOCPORT}': truncate255(locPortName),
                  		'{#REM.DEVICEID}': truncate255(n.remote_device_id || ''),
                  		'{#REM.PORTID}': truncate255(n.remote_port_id || '')
                  	});
                  }
                  
                  return JSON.stringify(out);
                  
        - uuid: efb71cfed96f41158677239b9bf740e7
          name: 'LLDP neighbor discovery'
          type: DEPENDENT
          key: lldp.rem.discovery
          lifetime_type: DELETE_NEVER
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: c2780cdc882d4251bb3d729c66d1f88d
              name: 'LLDP neighbor on {#LOCPORT}'
              type: DEPENDENT
              key: 'lldp.rem[{#LOCPORT},"{#REM.CHASSIS}","{#REM.PORTID}"]'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // lldp.rem[{#LOCPORT},"{#REM.CHASSIS}","{#REM.PORTID}"] item prototype preprocessing, step 1 of
                      // 2 (T-model revised spec §1.1.1/§1.1.3). Selects the neighbor whose (local port, chassis id,
                      // port id) matches this item's own key parameters and returns it as JSON. Absent ->
                      // {"present":false}; never throws (an exception here would flood the item with "not supported"
                      // errors on every push after this neighbor leaves).
                      
                      var TARGET_LOCPORT = '{#LOCPORT}';
                      var TARGET_CHASSIS = '{#REM.CHASSIS}';
                      var TARGET_PORTID = '{#REM.PORTID}';
                      
                      function truncate255(s) {
                      	s = (s === undefined || s === null) ? '' : String(s);
                      	return s.length > 255 ? s.substring(0, 255) : s;
                      }
                      
                      var data;
                      try {
                      	data = JSON.parse(value);
                      }
                      catch (e) {
                      	return JSON.stringify({present: false});
                      }
                      
                      var portsByIndex = {};
                      var ports = data.ports || [];
                      for (var p = 0; p < ports.length; p++) {
                      	portsByIndex[ports[p].if_index] = ports[p];
                      }
                      
                      var neighbors = data.neighbors || [];
                      for (var i = 0; i < neighbors.length; i++) {
                      	var n = neighbors[i];
                      	if (!n.remote_chassis_id && !n.remote_sysname) {
                      		continue;
                      	}
                      	var localPort = portsByIndex[n.local_if_index];
                      	var locPortName = truncate255(localPort ? localPort.name : String(n.local_if_index));
                      	if (locPortName === TARGET_LOCPORT
                      			&& truncate255(n.remote_chassis_id || '') === TARGET_CHASSIS
                      			&& truncate255(n.remote_port_id || '') === TARGET_PORTID) {
                      		return JSON.stringify({present: true, neighbor: n});
                      	}
                      }
                      
                      return JSON.stringify({present: false});
                      
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: topology.discovery.raw
              tags:
                - tag: interface
                  value: '{#LOCPORT}'
                - tag: topo.neighbor.chassis
                  value: '{#REM.CHASSIS}'
                - tag: topo.neighbor.chassis_type
                  value: '{#REM.CHASSISTYPE}'
                - tag: topo.neighbor.mgmt_ip
                  value: '{#REM.MGMTIP}'
                - tag: topo.neighbor.name
                  value: '{#REM.NAME}'
                - tag: topo.neighbor.port
                  value: '{#REM.PORTID}'
                - tag: topo.neighbor.port_descr
                  value: '{#REM.PORTDESCR}'
                - tag: topo.role
                  value: neighbor
                - tag: topo.via
                  value: lldp
          master_item:
            key: topology.discovery.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // lldp.rem.discovery LLD preprocessing (T-model revised spec §1.1.1/§1.1.3/§2/§3/§4).
                  //
                  // Item key uses the neighbor's OWN chassis id + port id as key parameters (quoted -- both can
                  // contain commas/spaces/brackets) instead of the transient lldpRemIndex the neighbor happened
                  // to get assigned this run, or a synthetic hash of them: lldpRemIndex changes whenever a
                  // neighbor's LLDP session restarts (even for the exact same physical link), which used to mint
                  // a brand-new item and orphan the old one's history every time that happened -- the whole
                  // reason for this key change (§1.1.1's "stable item keys").
                  //
                  // Raw neighbor facts travel as item tags (§1.1.3), not folded into one resolved "port" string
                  // at collection time -- interface/port matching and "is this really an interface name" both
                  // become read-time (reader) decisions instead, so the template stays a thin pass-through of
                  // what the agent actually said.
                  
                  var CHASSIS_TYPE_MAP = {
                  	'macAddress': 'mac',
                  	'networkAddress': 'netaddr',
                  	'interfaceName': 'ifname',
                  	'local': 'local'
                  	// chassisComponent/interfaceAlias/portComponent have no slot in the 4-value
                  	// mac/netaddr/ifname/local set this spec defines -- left unmapped (empty chassis_type),
                  	// same as an absent chassis id subtype at all.
                  };
                  
                  function truncate255(s) {
                  	s = (s === undefined || s === null) ? '' : String(s);
                  	return s.length > 255 ? s.substring(0, 255) : s;
                  }
                  
                  var data;
                  try {
                  	data = JSON.parse(value);
                  }
                  catch (e) {
                  	return JSON.stringify([]);
                  }
                  
                  var portsByIndex = {};
                  var ports = data.ports || [];
                  for (var p = 0; p < ports.length; p++) {
                  	portsByIndex[ports[p].if_index] = ports[p];
                  }
                  
                  var out = [];
                  var neighbors = data.neighbors || [];
                  for (var i = 0; i < neighbors.length; i++) {
                  	var n = neighbors[i];
                  
                  	// T-model spec / G-spec rule 1: a participant with neither chassis id nor sysname can't be
                  	// identified at all -- skip it.
                  	if (!n.remote_chassis_id && !n.remote_sysname) {
                  		continue;
                  	}
                  
                  	var localPort = portsByIndex[n.local_if_index];
                  	var locPortName = localPort ? localPort.name : String(n.local_if_index);
                  
                  	var chassisType = n.remote_chassis_id_subtype ? (CHASSIS_TYPE_MAP[n.remote_chassis_id_subtype] || '') : '';
                  
                  	out.push({
                  		'{#LOCPORT}': truncate255(locPortName),
                  		'{#REM.CHASSIS}': truncate255(n.remote_chassis_id || ''),
                  		'{#REM.CHASSISTYPE}': chassisType,
                  		'{#REM.MGMTIP}': truncate255(n.remote_mgmt_ip || ''),
                  		'{#REM.NAME}': truncate255(n.remote_sysname || ''),
                  		'{#REM.PORTID}': truncate255(n.remote_port_id || ''),
                  		'{#REM.PORTIDSUBTYPE}': n.remote_port_id_subtype || '',
                  		'{#REM.PORTDESCR}': truncate255(n.remote_port_desc || '')
                  	});
                  }
                  
                  return JSON.stringify(out);
                  

