zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 79f31eeab03146229b1e019097fad672
      name: Templates
  templates:
    - uuid: 7a25304ee1594ed68f582ef727cfd1fd
      template: 'Topology Discovery Reporter'
      name: 'Topology Discovery Reporter'
      description: 'Topology discovery collector (prototype, spec §4.1): Trapper items + self-monitoring heartbeat trigger for a reporter Host.'
      groups:
        - name: Templates
      items:
        - uuid: ee097a4ef3c14af79052cf90bc60c897
          name: 'Topology reporter self'
          type: DEPENDENT
          key: topo.self
          value_type: TEXT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.reporter
          master_item:
            key: topology.discovery.raw
        - uuid: 6430a7f3ec1d47d586204644dfe93d5b
          name: 'Topology discovery heartbeat'
          type: TRAP
          key: topology.discovery.heartbeat
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          triggers:
            - uuid: c5282161e47c4fb3b84dd04ea16582aa
              expression: 'nodata(/Topology Discovery Reporter/topology.discovery.heartbeat,10m)'
              name: 'Topology discovery heartbeat missing on {HOST.NAME} for 10m'
              priority: AVERAGE
              description: '10m staleness window: prototype has no fixed push interval mandated (spec §4.1); 10m gives generous headroom over any reasonable push cadence (e.g. 1-5m) while still catching a genuinely stalled/misconfigured push component promptly. Adjust to match the real push interval once one is fixed.'
              manual_close: 'YES'
        - uuid: c1e2b45c337340059c773057252cf5bc
          name: 'Topology discovery raw blob'
          type: TRAP
          key: topology.discovery.raw
          value_type: TEXT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
      discovery_rules:
        - uuid: 79f019c0f77043149d522437cc9e270f
          name: 'Topology neighbor discovery'
          type: DEPENDENT
          key: topo.nbr.discovery
          lifetime_type: DELETE_NEVER
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 3613e403066f413799d540e6d2b17993
              name: 'Topology neighbor on {#LOCPORT}'
              type: DEPENDENT
              key: 'topo.nbr[{#LOCIFINDEX},{#NBRKEY}]'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // topo.nbr[{#LOCIFINDEX},{#NBRKEY}] item prototype preprocessing, step 1 of 2 (T-model spec §3.3).
                      // Selects the neighbor from the current topology.discovery.raw blob whose computed NBRKEY equals
                      // this item's own {#NBRKEY} macro and returns it as JSON. Absent -> {"present":false}; never
                      // throws (an exception here would flood the item with "not supported" errors on every push after
                      // this neighbor leaves -- returning a value instead is what lets step 2's discard-unchanged
                      // heartbeat (§3.3) and the assembler's per-side staleness (§5.4) work at all).
                      //
                      // Hash/normalization helpers duplicated from topo.nbr.discovery's own script -- see that script's
                      // header comment for why (no shared module mechanism in Zabbix preprocessing) and where the shared
                      // FNV-1a test vectors live.
                      
                      var HASH_SEED1 = 2166136261;
                      var HASH_SEED2 = 2654435761;
                      var FNV_PRIME = 16777619;
                      
                      function fnv1a32(str, seed) {
                      	var hash = seed;
                      	for (var i = 0; i < str.length; i++) {
                      		hash = hash ^ str.charCodeAt(i);
                      		var hi = (hash >>> 16) * FNV_PRIME & 0xffff;
                      		var lo = (hash & 0xffff) * FNV_PRIME;
                      		hash = ((hi << 16) + lo) >>> 0;
                      	}
                      	return hash >>> 0;
                      }
                      
                      function hexHash16(str) {
                      	var h1 = fnv1a32(str, HASH_SEED1).toString(16);
                      	var h2 = fnv1a32(str, HASH_SEED2).toString(16);
                      	while (h1.length < 8) { h1 = '0' + h1; }
                      	while (h2.length < 8) { h2 = '0' + h2; }
                      	return h1 + h2;
                      }
                      
                      function canonicalPeerId(neighbor, reporterHost) {
                      	if (neighbor.remote_chassis_id) {
                      		return 'c:' + String(neighbor.remote_chassis_id).toLowerCase();
                      	}
                      	return 's:' + reporterHost + ':' + neighbor.local_if_index + ':' + (neighbor.remote_sysname || '');
                      }
                      
                      var TARGET_NBRKEY = '{#NBRKEY}';
                      var TARGET_LOCIFINDEX = '{#LOCIFINDEX}';
                      var reporterHost = '{HOST.HOST}';
                      
                      var data;
                      try {
                      	data = JSON.parse(value);
                      }
                      catch (e) {
                      	return JSON.stringify({present: false});
                      }
                      
                      var neighbors = data.neighbors || [];
                      for (var i = 0; i < neighbors.length; i++) {
                      	var n = neighbors[i];
                      	if (String(n.local_if_index) !== TARGET_LOCIFINDEX) {
                      		continue;
                      	}
                      	if (!n.remote_chassis_id && !n.remote_sysname) {
                      		continue;
                      	}
                      	var peerId = canonicalPeerId(n, reporterHost);
                      	if (peerId.length > 255) {
                      		peerId = 'h:' + hexHash16(peerId);
                      	}
                      	if (hexHash16(String(n.local_if_index) + '|' + peerId) === TARGET_NBRKEY) {
                      		return JSON.stringify({present: true, neighbor: n});
                      	}
                      }
                      
                      return JSON.stringify({present: false});
                      
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: topology.discovery.raw
              tags:
                - tag: interface
                  value: '{#LOCPORT}'
                - tag: topo.peer.id
                  value: '{#PEERID}'
                - tag: topo.peer.name
                  value: '{#PEERNAME}'
                - tag: topo.peer.port
                  value: '{#PEERPORT}'
                - tag: topo.role
                  value: neighbor
                - tag: topo.via
                  value: '{#VIA}'
          master_item:
            key: topology.discovery.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // topo.nbr.discovery LLD preprocessing (T-model spec §3.2).
                  //
                  // Hash and normalization helpers below are deliberately duplicated (byte-for-byte) in the item
                  // prototype's own preprocessing script (topo.nbr item, §3.3) and in the PHP assembler
                  // (CTopologyTModel::fnv1a32Hex/normalizePortName/resolvePortLabel/canonicalPeerId) -- Zabbix
                  // preprocessing scripts have no shared "module", and the spec's constraint 5 requires the G-model's
                  // port/MAC normalization logic to be reused, not reinvented, so the same rule is expressed three
                  // times: here (LLD), item-prototype preprocessing (per-neighbor lookup) and the assembler (peer-port
                  // resolution against a reporter's own ports, §5.4). See topo-nbr-hash-vectors.json for the shared
                  // FNV-1a test vectors all three implementations are checked against.
                  
                  var HASH_SEED1 = 2166136261;   // 0x811c9dc5 -- standard FNV-1a 32-bit offset basis
                  var HASH_SEED2 = 2654435761;   // 0x9e3779b1 -- distinct 2nd-pass seed (arbitrary, just != SEED1)
                  var FNV_PRIME = 16777619;      // 0x01000193
                  
                  function fnv1a32(str, seed) {
                  	var hash = seed;
                  	for (var i = 0; i < str.length; i++) {
                  		hash = hash ^ str.charCodeAt(i);
                  		// Duktape (Zabbix's embedded JS engine) has no Math.imul in older builds; do the 32-bit
                  		// multiply by hand instead of relying on it, split into 16-bit halves to stay within the
                  		// double's exact-integer range (2^53) before truncating back to uint32.
                  		var hi = (hash >>> 16) * FNV_PRIME & 0xffff;
                  		var lo = (hash & 0xffff) * FNV_PRIME;
                  		hash = ((hi << 16) + lo) >>> 0;
                  	}
                  	return hash >>> 0;
                  }
                  
                  function hexHash16(str) {
                  	var h1 = fnv1a32(str, HASH_SEED1).toString(16);
                  	var h2 = fnv1a32(str, HASH_SEED2).toString(16);
                  	while (h1.length < 8) { h1 = '0' + h1; }
                  	while (h2.length < 8) { h2 = '0' + h2; }
                  	return h1 + h2;
                  }
                  
                  function truncate255(s) {
                  	s = (s === undefined || s === null) ? '' : String(s);
                  	return s.length > 255 ? s.substring(0, 255) : s;
                  }
                  
                  // Line-for-line port of ingest.php's $normalize_port_name (G-spec §3 rule 4 / constraint 5).
                  var LONG_TO_SHORT = {
                  	'gigabitethernet': 'gi',
                  	'tengigabitethernet': 'te',
                  	'fastethernet': 'fa',
                  	'port-channel': 'po'
                  };
                  function normalizePortName(name) {
                  	var lower = String(name).toLowerCase().replace(/^\s+|\s+$/g, '');
                  	for (var long in LONG_TO_SHORT) {
                  		if (lower.indexOf(long) === 0) {
                  			return LONG_TO_SHORT[long] + lower.substring(long.length);
                  		}
                  	}
                  	return lower;
                  }
                  
                  // Line-for-line port of push.py's resolve_port_label()/ingest.php's $resolve_port_label
                  // (G-spec / constraint 5): prefer remote_port_desc; only when empty, branch on
                  // remote_port_id_subtype.
                  function resolvePortLabel(remotePortDesc, remotePortId, remotePortIdSubtype) {
                  	if (remotePortDesc) { return remotePortDesc; }
                  	if ((remotePortIdSubtype === 'interfaceName' || remotePortIdSubtype === 'macAddress') && remotePortId) {
                  		return remotePortId;
                  	}
                  	return remotePortId ? remotePortId : 'unknown';
                  }
                  
                  // Canonical peer id (T-model spec §4.1): chassis id present -> 'c:' + normalized chassis id
                  // (MAC-subtype values already arrive lowercase colon form from push.py; lowercase defensively
                  // anyway); otherwise 's:' + reporter host technical name + ':' + local_if_index + ':' + sysname.
                  // The spec text says "reporter hostid" -- {HOST.HOST} (Zabbix's unique per-host technical name) is
                  // used here instead, since Zabbix preprocessing macros don't expose the raw numeric hostid; it's
                  // equally stable/unique per reporter and is exactly what the assembler resolves this same host back
                  // to via host.get. Documented as a deliberate substitution, not a deviation from the intent.
                  function canonicalPeerId(neighbor, reporterHost) {
                  	if (neighbor.remote_chassis_id) {
                  		return 'c:' + String(neighbor.remote_chassis_id).toLowerCase();
                  	}
                  	return 's:' + reporterHost + ':' + neighbor.local_if_index + ':' + (neighbor.remote_sysname || '');
                  }
                  
                  var data;
                  try {
                  	data = JSON.parse(value);
                  }
                  catch (e) {
                  	return JSON.stringify([]);
                  }
                  
                  var reporterHost = '{HOST.HOST}';
                  var portsByIndex = {};
                  var ports = data.ports || [];
                  for (var p = 0; p < ports.length; p++) {
                  	portsByIndex[ports[p].if_index] = ports[p];
                  }
                  
                  var out = [];
                  var neighbors = data.neighbors || [];
                  for (var i = 0; i < neighbors.length; i++) {
                  	var n = neighbors[i];
                  
                  	// T-model spec §3.2 / G-spec §3 rule 1: a participant with neither chassis id nor sysname
                  	// can't be identified at all -- skip it (mirrors ingest.php's stats.resolved filter).
                  	if (!n.remote_chassis_id && !n.remote_sysname) {
                  		continue;
                  	}
                  
                  	var peerId = canonicalPeerId(n, reporterHost);
                  	if (peerId.length > 255) {
                  		peerId = 'h:' + hexHash16(peerId);
                  	}
                  
                  	var localPort = portsByIndex[n.local_if_index];
                  	var locPortName = localPort ? localPort.name : String(n.local_if_index);
                  
                  	var nbrKey = hexHash16(String(n.local_if_index) + '|' + peerId);
                  
                  	var peerPortRaw = resolvePortLabel(n.remote_port_desc, n.remote_port_id, n.remote_port_id_subtype);
                  	var peerPort = (peerPortRaw && peerPortRaw !== 'unknown') ? normalizePortName(peerPortRaw) : '';
                  
                  	out.push({
                  		'{#LOCIFINDEX}': String(n.local_if_index),
                  		'{#LOCPORT}': truncate255(locPortName),
                  		'{#PEERID}': peerId,
                  		'{#NBRKEY}': nbrKey,
                  		'{#PEERPORT}': peerPort,
                  		'{#PEERNAME}': truncate255(n.remote_sysname || ''),
                  		'{#VIA}': n.via || 'lldp'
                  	});
                  }
                  
                  return JSON.stringify(out);
                  

