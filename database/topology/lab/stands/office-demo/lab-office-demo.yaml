  - id: no-cdp-sw21
    reason: "report F-1: the HP 2530 CDP table is a copy of LLDP; without it each Windows host on an HP port gets one link"
    type: omit_mib
    device: SW21-07-ACC-2530-48G
    mib: cdp
  - id: no-cdp-sw22
    reason: "report F-1: the HP 2530 CDP table is a copy of LLDP; without it each Windows host on an HP port gets one link"
    type: omit_mib
    device: SW22-07-ACC-2530-48G
    mib: cdp
  - id: na-reboot-sw15-1-1-1
    reason: "report F-7: NA device restarts with a new random (locally administered) chassis MAC; model §6.7.1 new Device, §8.4 supersede, §6.7.0 address key moves"
    type: override_oid
    device: SW15-10-POE-6000-24G
    oid: lldpRemChassisId
    row: 1/1/1
    value_hex: "3a5c91e2074b"        # invented; old value 12bfb8b96af5
  - id: link-down-sw12-42
    reason: "D1 step 1: the link goes down; ifOperStatus = down(2) on the SW12 end (the template trigger needs a change of value, so the deviation is enabled at step 1, not in the base lab)"
    type: override_oid
    device: SW12-10-CORE-6000-48G
    oid: 1.3.6.1.2.1.2.2.1.8.42          # ifOperStatus.42 = port 1/1/42, was up(1)
    value: 2
  - id: link-down-sw13-48
    reason: "D1 step 1: the same link, the SW13 end (port 1/1/48, ifIndex 48)"
    type: override_oid
    device: SW13-10-ACC-6000-48G
    oid: 1.3.6.1.2.1.2.2.1.8.48          # ifOperStatus.48 = port 1/1/48, was up(1)
    value: 2
  - id: speed-mismatch-sw15-21
    reason: "task 119 section 3 (model 2.100 §12.3, FR-C V-25): the trunk SW12 1/1/41 - SW15 1/1/21 falls back to 100 Mbit/s on the SW15 end only (a bad cable or a failed autonegotiation): ifHighSpeed.21 = 100 (Mbit/s), both ends stay up; R1 has no link with different speeds, the demo stand D1 has this one (step 7)"
    type: override_oid
    device: SW15-10-POE-6000-24G
    oid: 1.3.6.1.2.1.31.1.1.1.15.21          # ifHighSpeed.21 = port 1/1/21, was 1000
    value: 100
  - id: cdp-port-differs
    reason: "task 130 (lab 2.41, model §8.5): LLDP and CDP of SW16 port 48 report the same switch (SW18) at different ports: the LLDP row says port 44 (the real cable, SW16 48 - SW18 44), the CDP row now says port 40 (a real port of SW18 with no neighbor): cdpCacheDevicePort.48.1 = \"40\" instead of \"44\" (D1 step 8). A deviation, not a change of the capture"
    type: override_oid
    device: SW16-09-ACC-2530-48G
    oid: 1.3.6.1.4.1.9.9.23.1.2.1.1.7.48.1          # cdpCacheDevicePort.48.1 (ifIndex 48 = port 48), was "44" (hex 3434)
    value: "40"
