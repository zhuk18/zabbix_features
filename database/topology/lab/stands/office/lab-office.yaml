# Lab stand "office": real capture of 12 switches (2026-10-14) + 2 synthetic gateways.
# Needs lab spec 2.6 (replay devices, §4.1a). See README.md.
settings:
  database: zabbix
  db_socket: /run/mysqld/mysqld.sock   # mariadb binds only to the LAN address (99-heidisql-listen.cnf), not localhost
  network: 192.0.2.0/24          # last octet = last octet of the captured address (192.168.17.N -> 192.0.2.N); AnyIP route, lab spec 6.1
  snmp_port: 1611
  community: zbxlab
  zabbix:                        # as in lab.yaml
    url: http://localhost/zabbix/ui/api_jsonrpc.php
    group: Test
    template_lld: Topology by SNMP
    template_push: Topology by push
    template_interfaces: Network Generic Device by SNMP
