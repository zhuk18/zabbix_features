id: S8
title: Identity without a chassis
base: lab.yaml
# topology-4-lab-simulator.md §9 S8 (model 2.47-2.52 §6.7.1, §6.7.5): a CDP-only reporter found by the reporter-address row, a name key with a serial, two Devices of
# one name that the operator merges, a VRRP address. On R1 (task 065) no claim is resolved by an address, a name key with a serial, or a merge of a Device without a
# chassis; this scenario makes each case happen. Addresses: 192.0.2.108 (Switch3), 192.0.2.150 and .151 (Server2).
patch:
  settings: {emit_subtypes: true}
  devices:
    Switch1:
      add_ports:
        - {ifindex: 10, name: Gi0/10}
        - {ifindex: 11, name: Gi0/11}
        - {ifindex: 12, name: Gi0/12}
        - {ifindex: 14, name: Gi0/14}
      cdp: true
      cdp_address: true
    Switch2:
      add_ports:
        - {ifindex: 12, name: Gi0/12}
        - {ifindex: 13, name: Gi0/13}
      cdp: true
    Switch3:
      ip: 192.0.2.108
      chassis: {subtype: mac, value: "00:11:22:33:44:b3"}
      port_mac_prefix: "02:00:00:08"
      lldp: false
      cdp: true
      cdp_address: true
      ports:
        - {ifindex: 1, name: Gi0/1}
      zabbix: {monitored: true, transport: lld, proxy: null}
    Nexus1:
      sysname: N9K-1
      chassis: {subtype: mac, value: "00:11:22:33:44:b4"}
      cdp: true
      cdp_device_id: "N9K-1(FDO2101X0AB)"
      cdp_address: false
      ports:
        - {ifindex: 1, name: Eth1/1}
      zabbix: {monitored: false}
    Server2:
      sysname: SRV2
      chassis: {subtype: mac, value: "00:11:22:33:44:b5"}
      lldp: false
      cdp: true
      cdp_device_id: name
      cdp_address: 192.0.2.150
      ports:
        - {ifindex: 1, name: eth0}
        - {ifindex: 2, name: eth1}
      zabbix: {monitored: false}
    R2:
      chassis: {subtype: mac, value: "00:11:22:33:44:b6"}
      lldp: false
      cdp: true
      cdp_address: 192.0.2.108
      ports:
        - {ifindex: 1, name: Gi0/0}
      zabbix: {monitored: false}
  cables:
    add:
      - [Switch1:Gi0/10, Switch3:Gi0/1]
      - [Switch1:Gi0/11, Nexus1:Eth1/1]
      - [Switch1:Gi0/12, Server2:eth0]
      - [Switch2:Gi0/12, Server2:eth1]
      - [Switch2:Gi0/13, R2:Gi0/0]
steps:
  - id: 0
    note: baseline
    assert:
      # Switch3 reports only by CDP; Switch1 sees it by CDP with the address 192.0.2.108, the SNMP address of the reporter Switch3: the reporter-address row, port to port
      - link: [Switch1:Gi0/10, Switch3:Gi0/1]
        state: active
        type: physical_link
      # the name key drops "(serial)": the LLDP sysname N9K-1 and the CDP device id N9K-1(FDO2101X0AB) of one port are one Device (the same-port row)
      - device_count: {key: N9K-1, equals: 1}
      - link: [Switch1:Gi0/11, N9K-1]
        state: active
      # two NICs of one server, seen on two switches: no join across ports (model 2.52: the Devices of one port), two Devices of one name and one address
      - device_count: {key: SRV2, equals: 2}
      - link: [Switch1:Gi0/12, SRV2]
        state: active
      - link: [Switch2:Gi0/12, SRV2]
        state: active
      - candidate: {key: SRV2, reason: same_address, pairs: 1}
      - candidate: {key: SRV2, reason: same_name, pairs: 1}
      # known limit (model 6.7.1: no lldpLocSysName): R2 sends 192.0.2.108, the address of Switch3 (a VRRP address), and the reporter has no name to compare: R2 resolves to Switch3
      # when the sysname of the reporter is collected, this row changes to "a Device R2"
      - link: [Switch2:Gi0/13, Switch3]
        state: active
  - id: 1
    note: Server2 advertises 192.0.2.151 on both NICs
    devices: {Server2: {cdp_address: 192.0.2.151}}
    assert:
      - device_count: {key: SRV2, equals: 2}
      - status: {field: devices_created, equals: 0}
  - id: 2
    note: Server2:eth0 moves from Switch1:Gi0/12 to Switch1:Gi0/14
    cables:
      remove: [[Switch1:Gi0/12, Server2:eth0]]
      add: [[Switch1:Gi0/14, Server2:eth0]]
    assert:
      - status: {field: devices_created, equals: 1}
      - device_count: {key: SRV2, equals: 3}
      - link: [Switch1:Gi0/14, SRV2]
        state: active
      - candidate: {key: SRV2, reason: same_address, pairs: 3}
  - id: 3
    note: the operator merges the three Devices SRV2 and keeps the one of Switch2:Gi0/12
    operator: {merge_group: SRV2, keep: Switch2:Gi0/12}
    assert:
      - device_count: {key: SRV2, equals: 1}
      - link: [Switch1:Gi0/14, SRV2]
        state: active
      - link: [Switch2:Gi0/12, SRV2]
        state: active
      - candidate: {key: SRV2, reason: same_address, pairs: 0}
      # the merged Device's scope_ports hold the three ports (model 2.52): the ingest after the merge makes no Device
      - status: {field: devices_created, equals: 0}
  - id: 4
    note: no change
    assert:
      - status: {field: devices_created, equals: 0}
      - device_count: {key: SRV2, equals: 1}
      - edge_id_same_as: {step: 3, link: [Switch1:Gi0/14, SRV2]}
      - edge_id_same_as: {step: 3, link: [Switch2:Gi0/12, SRV2]}
