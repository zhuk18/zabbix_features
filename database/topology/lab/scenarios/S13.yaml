id: S13
title: CDP-only reporter by its own CDP device ID (model 2.96 §6.4 step 8)
base: lab.yaml
# topology-4-lab-simulator.md S13 (task 113; model 2.96 §6.4 steps 2 and 8, §6.7.0; LLD 2.19 source `device`). Two reporters, addresses 192.0.2.170 and .171:
#   C: CDP only (no LLDP-MIB, so no chassis id), 4 ports, `cdp_device_id: C13.lab`: its neighbors know it by that device ID and a loopback address (10.255.0.13, not its SNMP interface
#   address), and its own walk has the same value as cdpGlobalDeviceId. N: LLDP and CDP, 4 ports. Cable N:Gi0/1 - C:Gi0/1.
# Before the DEVICE row, N's CDP report of C (a name that is no key of any reporter, an address that is no SNMP address) made a second Device for C. The key of a name is the name key
# of normalization §4.6: the domain is cut (c13.lab -> c13).
# Own name and class (lab 2.36, task 115): D (192.0.2.172, LLDP and CDP; sysname D13-own; its neighbors know it by the CDP device ID neighbors-call-it-d13.lab; own bits bridge router, CDP bits
# switch host) and M (192.0.2.173, CDP only), cable M:Gi0/1 - D:Gi0/2. The own name and the own class (Switch, not Station from `host`) win over what M reports.
# Step 1: C is renamed (its neighbors and its own walk say C13-new.lab): the same Device, the new key replaces the old one, the same link.
patch:
  settings: {emit_subtypes: true, emit_loc_port_table: true}
  devices:
    C:
      ip: 192.0.2.170
      chassis: {subtype: mac, value: "00:11:22:33:44:d0"}
      port_mac_prefix: "02:00:00:13"
      lldp: false
      cdp: true
      cdp_device_id: C13.lab
      cdp_address: 10.255.0.13
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
        - {ifindex: 3, name: Gi0/3}
        - {ifindex: 4, name: Gi0/4}
      zabbix: {monitored: true, transport: lld, proxy: null}
    N:
      ip: 192.0.2.171
      chassis: {subtype: mac, value: "00:11:22:33:44:d1"}
      port_mac_prefix: "02:00:00:14"
      lldp: true
      cdp: true
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
        - {ifindex: 3, name: Gi0/3}
        - {ifindex: 4, name: Gi0/4}
      zabbix: {monitored: true, transport: lld, proxy: null}
    D:
      ip: 192.0.2.172
      sysname: D13-own
      chassis: {subtype: mac, value: "00:11:22:33:44:d2"}
      port_mac_prefix: "02:00:00:15"
      lldp: true
      cdp: true
      lldp_capabilities: [bridge, router]
      cdp_capabilities: [switch, host]
      cdp_device_id: neighbors-call-it-d13.lab
      cdp_address: 10.255.0.15
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
        - {ifindex: 3, name: Gi0/3}
        - {ifindex: 4, name: Gi0/4}
      zabbix: {monitored: true, transport: lld, proxy: null}
    M:
      ip: 192.0.2.173
      chassis: {subtype: mac, value: "00:11:22:33:44:d3"}
      port_mac_prefix: "02:00:00:16"
      lldp: false
      cdp: true
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
        - {ifindex: 3, name: Gi0/3}
        - {ifindex: 4, name: Gi0/4}
      zabbix: {monitored: true, transport: lld, proxy: null}
  cables:
    add:
      - [N:Gi0/1, C:Gi0/1]
      - [M:Gi0/1, D:Gi0/2]
steps:
  - id: 0
    note: baseline, both monitored, every master item polled
    poll_all: true
    assert:
      - device_count: {key: C, equals: 1}
      - device_count: {key: N, equals: 1}
      - device_keys: {device: C, equals: ["cdp:server:c13"]}
      - link: [N:Gi0/1, C:Gi0/1]
        state: active
        type: physical_link
      - candidate: {key: C, reason: reporter_cdp_key, pairs: 0}
      # own name and class (2.36): the Device of D is found by its own name (attrs.sysname), the host D represents it
      - device_count: {key: {sysname: D13-own}, equals: 1, represented_by: D}
      - device_count: {key: {sysname: neighbors-call-it-d13.lab}, equals: 0}
      - device_class: {device: {sysname: D13-own}, equals: switch, bits: [bridge, router]}
      - device_keys: {device: {sysname: D13-own}, equals: ["chassis:mac:00:11:22:33:44:d2", "cdp:server:neighbors-call-it-d13"]}
      - candidate: {key: {sysname: D13-own}, reason: same_name, pairs: 0}
      - candidate: {key: {sysname: D13-own}, reason: same_address, pairs: 0}
      - candidate: {key: {sysname: D13-own}, reason: reporter_cdp_key, pairs: 0}
      - link: [M:Gi0/1, D13-own:Gi0/2]
        state: active
        type: physical_link
  - id: 1
    note: C is renamed (its neighbors and its own walk)
    poll_all: true
    devices:
      C: {cdp_device_id: C13-new.lab}
    assert:
      - device_count: {key: C, equals: 1}
      - device_keys: {device: C, equals: ["cdp:server:c13-new"]}
      - edge_id_same_as: {step: 0, link: [N:Gi0/1, C:Gi0/1]}
      - candidate: {key: C, reason: reporter_cdp_key, pairs: 0}
      - status: {field: devices_created, equals: 0}
