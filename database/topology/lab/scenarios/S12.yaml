id: S12
title: ifIndex changes of a reporter (model §6.6, task 086)
base: lab.yaml
# A reporter R that has monitored neighbors on two ports (A on Gi0/1, B on Gi0/2: they report R's ports by name, and R reports theirs) and one unmonitored neighbor (N on Gi0/3).
# Lab spec §9 S12 (model 2.65, 2.93 §3.2, §6.6, task 089, 110). R has one PORTS rule (the topology template) and the interface discovery without a topology type; the port items are those that
# the view finds (by the ifIndex of the port; an interface with a number for LLD value is not found by its name). The interface discovery rule is polled
# only at step 0 and in the steps with `poll_interface_discovery`: the time between the polls of the two rules is what the scenario shows.
# Step 1: R:Gi0/1 gets 11 (an index not used before), the interface discovery rule is not polled. Step 2: the rule is polled. Step 3: Gi0/1 and Gi0/2 exchange their indexes (Gi0/1: 2, Gi0/2: 11),
# not polled. Step 4: polled. Names stay (deviation ifindex_renumber with `map`). `poll_all: true` polls the core master items of every device in each step.
patch:
  settings: {emit_subtypes: true, emit_loc_port_table: true}
  devices:
    R:
      ip: 192.0.2.173
      chassis: {subtype: mac, value: "00:11:22:33:44:f0"}
      port_mac_prefix: "02:00:00:10"
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
        - {ifindex: 3, name: Gi0/3}
        - {ifindex: 4, name: Gi0/4}
      zabbix: {monitored: true, transport: lld, proxy: null}
    A:
      ip: 192.0.2.174
      chassis: {subtype: mac, value: "00:11:22:33:44:f1"}
      port_mac_prefix: "02:00:00:11"
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
      zabbix: {monitored: true, transport: lld, proxy: null}
    B:
      ip: 192.0.2.175
      chassis: {subtype: mac, value: "00:11:22:33:44:f2"}
      port_mac_prefix: "02:00:00:12"
      ports:
        - {ifindex: 1, name: Gi0/1}
        - {ifindex: 2, name: Gi0/2}
      zabbix: {monitored: true, transport: lld, proxy: null}
    N:
      chassis: {subtype: mac, value: "00:11:22:33:44:f3"}
      ports: [{ifindex: 1, name: eth0}]
      zabbix: {monitored: false}
  cables:
    add:
      - [R:Gi0/1, A:Gi0/1]
      - [R:Gi0/2, B:Gi0/1]
      - [R:Gi0/3, N:eth0]
  deviations:
    - id: r-gi01-new-index
      reason: "model §6.6 A port follows its name: Gi0/1 gets an ifIndex that was not used before"
      type: ifindex_renumber
      device: R
      map: {Gi0/1: 11}
    - id: r-gi01-gi02-exchange
      reason: "model §6.6 A port follows its name: two ports exchange their ifIndex values"
      type: ifindex_renumber
      device: R
      map: {Gi0/1: 2, Gi0/2: 11}
steps:
  - id: 0
    note: baseline
    poll_all: true
    assert:
      - link: [R:Gi0/1, A:Gi0/1]
        state: active
        type: physical_link
      - link: [R:Gi0/2, B:Gi0/1]
        state: active
        type: physical_link
      - link: [R:Gi0/3, N:eth0]
        state: active
        type: physical_link
      - port: R:Gi0/1
        if_index: 1
      - port: R:Gi0/2
        if_index: 2
  - id: 1
    note: R:Gi0/1 has the ifIndex 11 (not used before); the interface discovery rule is not polled
    poll_all: true
    deviations: {enable: [r-gi01-new-index]}
    assert:
      - port: R:Gi0/1
        same_id_as_step: 0
        if_index: 11
        itemids: []
      - port: R:Gi0/2
        same_id_as_step: 0
        if_index: 2
        itemids_same_as: {step: 0, port: "R:Gi0/2"}
      - link: [R:Gi0/1, A:Gi0/1]
        state: active
        type: physical_link
      - edge_id_same_as: {step: 0, link: [R:Gi0/1, A:Gi0/1]}
      - edge_id_same_as: {step: 0, link: [R:Gi0/2, B:Gi0/1]}
      - edge_id_same_as: {step: 0, link: [R:Gi0/3, N:eth0]}
      - observation: {reporter: A, port: Gi0/1, remote: R}
        outcome: applied
        precision_lower: false
      - observation: {reporter: R, port: Gi0/1, remote: A}
        outcome: applied
        precision_lower: false
      - status: {field: ports_ambiguous, equals: 0}
      - status: {field: observations.ambiguous, equals: 0}
  - id: 2
    note: the interface discovery rule is polled
    poll_all: true
    poll_interface_discovery: [R]
    assert:
      - port: R:Gi0/1
        same_id_as_step: 0
        if_index: 11
      - port: R:Gi0/2
        same_id_as_step: 0
      - edge_id_same_as: {step: 0, link: [R:Gi0/1, A:Gi0/1]}
      - edge_id_same_as: {step: 0, link: [R:Gi0/2, B:Gi0/1]}
      - observation: {reporter: A, port: Gi0/1, remote: R}
        outcome: applied
        precision_lower: false
      - status: {field: ports_ambiguous, equals: 0}
  - id: 3
    note: R:Gi0/1 and R:Gi0/2 exchange their indexes (Gi0/1 2, Gi0/2 11); the interface discovery rule is not polled
    poll_all: true
    deviations: {disable: [r-gi01-new-index], enable: [r-gi01-gi02-exchange]}
    assert:
      - port: R:Gi0/1
        same_id_as_step: 0
        if_index: 2
        itemids_same_as: {step: 2, port: "R:Gi0/2"}
      - port: R:Gi0/2
        same_id_as_step: 0
        if_index: 11
        itemids_same_as: {step: 2, port: "R:Gi0/1"}
      - link: [R:Gi0/1, A:Gi0/1]
        state: active
        type: physical_link
      - edge_id_same_as: {step: 0, link: [R:Gi0/1, A:Gi0/1]}
      - edge_id_same_as: {step: 0, link: [R:Gi0/2, B:Gi0/1]}
      - observation: {reporter: A, port: Gi0/1, remote: R}
        outcome: applied
        precision_lower: false
      - observation: {reporter: B, port: Gi0/1, remote: R}
        outcome: applied
        precision_lower: false
      - status: {field: ports_ambiguous, equals: 0}
  - id: 4
    note: the interface discovery rule is polled
    poll_all: true
    poll_interface_discovery: [R]
    assert:
      - port: R:Gi0/1
        same_id_as_step: 0
        if_index: 2
        itemids_same_as: {step: 3, port: "R:Gi0/1"}
      - port: R:Gi0/2
        same_id_as_step: 0
        if_index: 11
        itemids_same_as: {step: 3, port: "R:Gi0/2"}
      - edge_id_same_as: {step: 0, link: [R:Gi0/1, A:Gi0/1]}
      - edge_id_same_as: {step: 0, link: [R:Gi0/2, B:Gi0/1]}
      - status: {field: ports_ambiguous, equals: 0}
